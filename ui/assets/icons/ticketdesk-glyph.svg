<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Small-size TicketDesk mark (top bar, favicon): a support headset on a
       teal badge — the IT helpdesk — as the sibling of BugDesk's bug on
       indigo. A flat badge on a 24-unit grid so it stays crisp at 16–20px.
       ticketdesk-icon.svg is the large app icon. -->
  <title>TicketDesk</title>
  <rect width="24" height="24" rx="5.5" fill="#0D9488"/>
  <path d="M6 13.5v-2a6 6 0 0 1 12 0v2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="4.6" y="12" width="3.6" height="5.6" rx="1.6" fill="#FFFFFF"/>
  <rect x="15.8" y="12" width="3.6" height="5.6" rx="1.6" fill="#FFFFFF"/>
  <path d="M17.6 17.4c0 1.6-1.6 2.4-4.4 2.4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12.6" cy="19.8" r="1.1" fill="#FFFFFF"/>
</svg>
