<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Ticket Desk</title>
  <defs>
    <!-- Tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1F4A5C"/>
      <stop offset="0.55" stop-color="#10283A"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#0D9488" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="512" height="512" fill="url(#gridFade)"/>
    </mask>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>

    <!-- Ticket -->
    <path id="ticketShape" d="M130 176 H300 A18 18 0 0 0 336 176 H382 A24 24 0 0 1 406 200 V322 A24 24 0 0 1 382 346 H336 A18 18 0 0 0 300 346 H130 A24 24 0 0 1 106 322 V200 A24 24 0 0 1 130 176 Z"/>
    <linearGradient id="shell" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#99F6E4"/>
      <stop offset="0.45" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="shellBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="shellEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0FDFA" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#F0FDFA" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F0FDFA" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#051317"/>
      <stop offset="1" stop-color="#0B2A30"/>
    </linearGradient>

    <filter id="drop" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="blur" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="neon" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inset" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dy="4"/>
      <feGaussianBlur stdDeviation="4" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="inner"/>
      <feFlood flood-color="#000000" flood-opacity="0.8"/>
      <feComposite in2="inner" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
  </defs>

  <!-- ===== Tile ===== -->
  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="412" rx="140" ry="16" fill="#000000" opacity="0.55" filter="url(#blur)"/>

  <!-- ===== Back ticket (queue) ===== -->
  <g transform="rotate(9 256 261) translate(8 -30)" filter="url(#drop)">
    <use href="#ticketShape" fill="url(#shellBack)"/>
    <use href="#ticketShape" fill="none" stroke="#CCFBF1" stroke-opacity="0.35" stroke-width="2.5"/>
  </g>

  <!-- ===== Front ticket ===== -->
  <g transform="rotate(-6 256 261) translate(0 14)" filter="url(#drop)">
    <use href="#ticketShape" fill="url(#shell)"/>
    <use href="#ticketShape" fill="none" stroke="url(#shellEdge)" stroke-width="3"/>

    <!-- Specular highlight -->
    <ellipse cx="170" cy="190" rx="44" ry="9" fill="url(#spec)" transform="rotate(-4 170 190)"/>

    <!-- Perforation -->
    <line x1="318" y1="202" x2="318" y2="320" stroke="#042F2E" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 13"/>
    <line x1="319.5" y1="203.5" x2="319.5" y2="321.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 13"/>

    <!-- Queue screen -->
    <rect x="128" y="198" width="164" height="126" rx="18" fill="url(#screen)" filter="url(#inset)"/>
    <rect x="128.75" y="198.75" width="162.5" height="124.5" rx="17.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>

    <g filter="url(#neon)">
      <circle cx="152" cy="226" r="7" fill="#FB7185"/>
      <circle cx="152" cy="261" r="7" fill="#FBBF24"/>
      <circle cx="152" cy="296" r="7" fill="#34D399"/>
    </g>
    <rect x="168" y="220" width="104" height="12" rx="6" fill="#CCFBF1" opacity="0.92"/>
    <rect x="168" y="255" width="78" height="12" rx="6" fill="#CCFBF1" opacity="0.6"/>
    <rect x="168" y="290" width="52" height="12" rx="6" fill="#CCFBF1" opacity="0.35"/>
    <path d="M138 208 H206 Q170 226 138 262 Z" fill="#FFFFFF" opacity="0.05"/>

    <!-- Stub: resolved badge -->
    <circle cx="362" cy="238" r="23" fill="#042F2E" opacity="0.35"/>
    <g filter="url(#neon)">
      <circle cx="362" cy="236" r="21" fill="none" stroke="#F0FDFA" stroke-width="5"/>
      <path d="M352 236 l7 7 l13 -14" fill="none" stroke="#F0FDFA" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stub: barcode -->
    <g fill="#042F2E" opacity="0.6">
      <rect x="342" y="280" width="4" height="30" rx="1"/>
      <rect x="350" y="280" width="2" height="30" rx="1"/>
      <rect x="356" y="280" width="6" height="30" rx="1"/>
      <rect x="366" y="280" width="2" height="30" rx="1"/>
      <rect x="372" y="280" width="4" height="30" rx="1"/>
      <rect x="380" y="280" width="2" height="30" rx="1"/>
    </g>
  </g>
</svg>
