    <script>
        (() => {
            const params = new URLSearchParams(window.location.search || '');
            window.__ECOAGENT_DEBUG__ = params.has('dev_ts') || params.get('debug') === '1';
        })();
    </script>

    <!-- Browser-mode pywebview polyfill. -->
    <script>
        (() => {
            if (window.pywebview && window.pywebview.api) return;
            const api = new Proxy({}, {
                get(_, method) {
                    if (typeof method !== 'string') return undefined;
                    if (method === 'then') return undefined;
                    return async (...args) => {
                        const body = (args.length === 1 && args[0] && typeof args[0] === 'object' && !Array.isArray(args[0]))
                            ? JSON.stringify(args[0])
                            : JSON.stringify(args);
                        const resp = await fetch('/api/' + method, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body,
                        });
                        const data = await resp.json().catch(() => null);
                        if (!resp.ok || !data || data.ok === false) {
                            const msg = (data && data.error) || `Bridge call ${method} failed (${resp.status})`;
                            throw new Error(msg);
                        }
                        return data.result;
                    };
                },
            });
            window.pywebview = { api };
            window.dispatchEvent(new Event('pywebviewready'));
        })();
    </script>

    <!-- Original Ecosim chrome bootstrap + tiling-WM installer. -->
    <script type="module">
        import { bootstrapApplication } from './js/bootstrap/app_bootstrap.js';

        // Resolve the configured author names BEFORE any ticketdesk module is
        // imported (below and transitively, via install.js's own static
        // imports) — those modules read window.__BUGDESK_CONFIG__ once, at
        // module-evaluation time, so it must already be populated by then.
        // Falls back to generic defaults if the bridge is unreachable.
        window.__BUGDESK_CONFIG__ = { humanAuthor: 'reviewer', agentAuthor: 'agent' };
        try {
            const cfgRes = await fetch('/api/config', { headers: { accept: 'application/json' } });
            const cfg = cfgRes.ok ? await cfgRes.json() : null;
            if (cfg?.ok) {
                window.__BUGDESK_CONFIG__ = {
                    humanAuthor: cfg.humanAuthor || 'reviewer',
                    agentAuthor: cfg.agentAuthor || 'agent',
                };
            }
        } catch (err) {
            console.warn('BugDesk: /api/config unavailable, using defaults', err);
        }

        const root = document.getElementById('ecoagent-root');
        const notifications = document.getElementById('ecoagent-notifications');

        bootstrapApplication({
            root,
            mounts: { notifications },
            waitForHostBridge: true,
            enableConsoleLogging: window.__ECOAGENT_DEBUG__,
        }).then(async (runtime) => {
            const bus = runtime?.eventBus;
            if (bus) {
                bus.on?.('welcome-screen:shown', () => bus.emit?.('welcome-screen:hidden'));
                bus.emit?.('welcome-screen:hidden');
            }
            try {
                const { installTilingShell } = await import('./js/tiling/install.js');
                await installTilingShell({
                    eventBus: bus,
                    logger: runtime?.loggingService?.scoped?.('tiling-shell'),
                    runtime,
                });
            } catch (err) {
                console.error('tiling shell install failed', err);
            }
            window.__ecoagent = runtime;
        }).catch((error) => {
            console.error('EcoAgent bootstrap failed', error);
            const fallback = document.createElement('pre');
            fallback.className = 'bootstrap-error';
            fallback.textContent = 'Failed to bootstrap EcoAgent. Check console for details.';
            root.appendChild(fallback);
        });
    </script>
