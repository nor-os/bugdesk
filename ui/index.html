<body>

    <script>
        (() => {
            const params = new URLSearchParams(window.location.search || '');
            window.__BUGDESK_DEBUG__ = params.get('debug') === '1';
        })();
    </script>

    <!-- The bridge, in a browser. BugDesk's server speaks REST for everything
         except the two workspace-state calls FlexDesk's host adapter makes through
         `window.pywebview.api`, and those are the ONLY methods defined here.

         This used to be a Proxy that answered every method name with a function,
         backed by a server catch-all that answered every call with {ok:true}. The
         pair made every capability look present and every call look successful,
         which is the opposite of FlexDesk's host contract: a transport that lacks a
         method must not claim it, so the caller takes its fallback. The visible
         cost was CSV export — it found `save_file_dialog`, called it, got {ok:true}
         back and announced "Saved N rows" for a file that was never written, while
         the browser download that would have worked sat unreached below it. -->
    <script>
        (() => {
            if (window.pywebview && window.pywebview.api) return;
            const bridge = (method) => async (arg) => {
                const resp = await fetch('api/' + method, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(arg ?? {}),
                });
                const data = await resp.json().catch(() => null);
                if (!resp.ok || !data || data.ok === false) {
                    throw new Error((data && data.error) || `Bridge call ${method} failed (${resp.status})`);
                }
                return data.result;
            };
            window.pywebview = {
                api: {
                    workspace_state_read: bridge('workspace_state_read'),
                    workspace_state_write: bridge('workspace_state_write'),
                },
            };
            window.dispatchEvent(new Event('pywebviewready'));
        })();
    </script>

    <!-- Original Ecosim chrome bootstrap + tiling-WM installer. -->
    <script type="module">
        import { bootBugDesk } from './js/bootstrap/boot.js';
        import { appName, appIcon } from './js/core/app_identity.js';

        // Resolve WHO IS USING THIS before any ticketdesk module is imported
        // (below and transitively, via install.js's own static imports) — those
        // modules read window.__BUGDESK_CONFIG__ once, at module-evaluation
        // time, and filters.js bakes the two names into filter expressions built
        // at that same moment. So the identity step has to complete first, and
        // on a first run that means BLOCKING on the name prompt: asking
        // afterwards would leave every one of those constants holding the
        // pre-answer default until a reload.
        //
        // resolveIdentity() only prompts when the bridge reports
        // `configured: false` — i.e. no per-user profile and no BUGDESK_HUMAN.
        // An unreachable bridge falls back to the generic defaults without
        // prompting; see first_run.js.
        const { resolveIdentity } = await import('./js/ticketdesk/first_run.js');
        const cfg = await resolveIdentity();
        window.__BUGDESK_CONFIG__ = {
            // Which app this is: 'bugs' (default) or 'tracker'. Read at module
            // load by kind_taxonomy.js (which top-nav chips exist) and by
            // ticketdesk/backlog_data.js (which types are offered), so it has to
            // be resolved here, before either is evaluated — same reason as the
            // two names below.
            mode: cfg.mode === 'tracker' ? 'tracker' : 'bugs',
            // Which PRODUCT: TicketDesk only when the server was started with
            // --tracker; BugDesk otherwise, whatever store this page is on.
            // See core/app_identity.js.
            app: cfg.app === 'ticketdesk' ? 'ticketdesk' : 'bugdesk',
            // Whether `<name>_agent` is assignable here — false in tracker mode.
            agentsAssignable: cfg.agentsAssignable !== false,
            // True when the names below came from the bridge, not the fallback.
            fromBridge: cfg.ok === true,
            humanAuthor: cfg.humanAuthor || 'reviewer',
            agentAuthor: cfg.agentAuthor || 'agent',
            // The shared roster (bugdesk.json). Every assignee picker reads it,
            // so it has to be resolved before the modules that build those
            // pickers are evaluated — same reason as the two names above.
            collaborators: Array.isArray(cfg.collaborators) ? cfg.collaborators : [],
            assignees: Array.isArray(cfg.assignees) ? cfg.assignees : [],
            // The store this page is on — a project, or the tracker — and the
            // ones around it. The address says which (/p/<name>/, /t/); the
            // bridge says what that store has, since a project may have only
            // bugs or only a backlog.
            store: cfg.store || null,
            // Custom fields, hidden built-ins and custom statuses per record type
            // (project.json's `schema`). Read at module load by ticketdesk/schema.js.
            schema: cfg.schema || null,
            // The move tables, their flows and the custom actions (workflow.js).
            workflow: cfg.workflow || null,
            // Prefixes, padding, and every prefix still read (refs.js).
            numbering: cfg.numbering || null,
            // Auto-save and git (autosave.js, changes_pane.js).
            saving: cfg.saving || null,
            // Alert rules (alerts.js).
            alerts: Array.isArray(cfg.alerts) ? cfg.alerts : [],
            projects: Array.isArray(cfg.projects) ? cfg.projects : [],
            tracker: cfg.tracker || { available: false },
        };

        // In tracker mode this window is TicketDesk: its own name and icon. The
        // <title> and <link> above are BugDesk's, the default.
        document.title = appName();
        document.getElementById('app-favicon').href = appIcon();

        // The bars, the bus and the settings, then the shell between the bars.
        // A failure is shown on the page rather than left as a blank window: the
        // one thing worse than a crash is a crash that looks like an empty store.
        try {
            const { eventBus, loggingService } = bootBugDesk({
                enableConsoleLogging: window.__BUGDESK_DEBUG__,
            });
            const { installTilingShell } = await import('./js/tiling/install.js');
            await installTilingShell({
                eventBus,
                logger: loggingService.scoped?.('tiling-shell'),
            });
        } catch (error) {
            console.error(`${appName()} failed to start`, error);
            const fallback = document.createElement('pre');
            fallback.className = 'bootstrap-error';
            fallback.textContent = `${appName()} failed to start: ${error?.message || error}\nSee the browser console for details.`;
            document.body.appendChild(fallback);
        }
    </script>
